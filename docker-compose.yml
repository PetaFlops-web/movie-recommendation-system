version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pijak_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pijak_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pijak_password}
      POSTGRES_DB: ${DB_NAME:-pijak_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Initialize with SQL script
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pijak_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pijak_network

  # Backend Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pijak_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-pijak_user}:${DB_PASSWORD:-pijak_password}@postgres:5432/${DB_NAME:-pijak_db}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-development_secret_change_in_production}
      FRONTEND_URL: http://localhost:3000
      PYTHON_SERVICE_URL: http://python-service:5000
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - pijak_network
    command: npm run dev

  # Python ML Service
  python-service:
    build:
      context: ./backend/python_service
      dockerfile: Dockerfile
    container_name: pijak_python_service
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pijak_user}:${DB_PASSWORD:-pijak_password}@postgres:5432/${DB_NAME:-pijak_db}
      FLASK_ENV: development
      FLASK_PORT: 5000
      BACKEND_URL: http://backend:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/python_service:/app
    networks:
      - pijak_network
    command: python -u inference_server.py

  # Frontend Next.js App (Optional - usually run locally)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: pijak_frontend
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:3001
  #     NEXT_PUBLIC_PYTHON_API_URL: http://localhost:5000
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - pijak_network
  #   command: npm run dev

volumes:
  postgres_data:

networks:
  pijak_network:
    driver: bridge
